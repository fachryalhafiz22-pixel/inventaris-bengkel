<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIPAB TI – Peminjaman Alat Bengkel</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ffffff;--card:#fff;--tx:#1b2430;--mut:#667085;--bd:#dde3ec;--pri:#2457d6;--ok:#13795b;--okb:#dcf5ea;--warn:#b54708;--warnb:#fdf0d8;--bad:#b42318;--badb:#fde4e1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.side{position:sticky;top:16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
main{min-width:0}
.side .brand,.side .brand small{color:var(--pri)}
@media (max-width:760px){.layout{grid-template-columns:1fr}.side{position:static}nav{flex-direction:row!important;flex-wrap:wrap}nav button{width:auto!important}}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}.brand img{height:48px;width:auto}.brand small{display:block;font-weight:400;color:var(--mut);font-size:12px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{background:#fff;color:var(--pri);border:1px solid var(--bd);padding:10px 12px;border-radius:8px;cursor:pointer;font:inherit;text-align:left;width:100%}
nav button.on{background:#e8efff;color:var(--pri);border-color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mut);font-size:13px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:10px}
.btn{background:var(--pri);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:var(--bad);color:#fff}
.btn.s{padding:4px 9px;font-size:13px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.t-ok{background:var(--okb);color:var(--ok)}.t-w{background:var(--warnb);color:var(--warn)}.t-b{background:var(--badb);color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--ok)}
.login{max-width:360px;margin:12vh auto}
.err{color:var(--bad);font-size:13px;min-height:18px}
.hint{color:var(--mut);font-size:12px}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
@media print{.side,nav,header,.noprint{display:none!important}.layout{display:block}body{background:#fff;color:#000}}

function vDash(){var tot=S.alat.reduce(function(a,x){return a+x.total},0),out=S.alat.reduce(function(a,x){return a+dipinjam(x.id)},0),act=S.pinjam.filter(function(p){return!p.tglKembali}),late=act.filter(function(p){return p.tenggat<today()});
var rows=S.alat.map(function(a){var s=sedia(a),pc=a.total?Math.round(s/a.total*100):0;return '<tr><td>'+esc(a.kode)+'</td><td>'+esc(a.nama)+'</td><td>'+esc(a.kategori)+'</td><td>'+s+' / '+a.total+'</td><td><div class="bar"><i style="width:'+pc+'%"></i></div></td><td>'+(s>0?'<span class="tag t-ok">Tersedia</span>':'<span class="tag t-b">Habis</span>')+'</td></tr>'}).join('');
var lt=late.map(function(p){return '<tr><td>'+esc(p.peminjam)+'</td><td>'+esc(nm(p.alatId))+'</td><td>'+p.tenggat+'</td></tr>'}).join('')||'<tr><td colspan="3" class="hint">Tidak ada keterlambatan.</td></tr>';
return '<div class="grid"><div class="stat"><b>'+S.alat.length+'</b><span>Jenis alat</span></div><div class="stat"><b>'+(tot-out)+' / '+tot+'</b><span>Unit tersedia</span></div><div class="stat"><b>'+act.length+'</b><span>Peminjaman aktif</span></div><div class="stat"><b style="color:var(--bad)">'+late.length+'</b><span>Terlambat</span></div></div><div class="card"><h3>Ketersediaan alat</h3><div class="scroll"><table><tr><th>Kode</th><th>Alat</th><th>Kategori</th><th>Sedia</th><th>Stok</th><th>Status</th></tr>'+rows+'</table></div></div><div class="card"><h3>Peminjaman terlambat</h3><div class="scroll"><table><tr><th>Peminjam</th><th>Alat</th><th>Tenggat</th></tr>'+lt+'</table></div></div>'}
var editId=null;
function vInv(){var e=S.alat.find(function(a){return a.id===editId})||{kode:'',nama:'',kategori:'',total:1,kondisi:'Baik'};
var rows=S.alat.map(function(a){return '<tr><td>'+esc(a.kode)+'</td><td>'+esc(a.nama)+'</td><td>'+esc(a.kategori)+'</td><td>'+a.total+'</td><td>'+esc(a.kondisi)+'</td><td><button class="btn g s" onclick="editId='+a.id+';render()">Ubah</button> <button class="btn d s" onclick="delAlat('+a.id+')">Hapus</button></td></tr>'}).join('');
return '<div class="card"><h3>'+(editId?'Ubah alat':'Tambah alat')+'</h3><div class="row"><div><label>Kode</label><input id="k" value="'+esc(e.kode)+'"></div><div><label>Nama alat</label><input id="n" value="'+esc(e.nama)+'"></div><div><label>Kategori</label><input id="c" value="'+esc(e.kategori)+'"></div><div><label>Jumlah total</label><input id="t" type="number" min="1" value="'+e.total+'"></div><div><label>Kondisi</label><select id="o">'+['Baik','Perlu perbaikan','Rusak'].map(function(k){return '<option'+(k===e.kondisi?' selected':'')+'>'+k+'</option>'}).join('')+'</select></div></div><div class="err" id="e"></div><button class="btn" onclick="saveAlat()">Simpan</button> '+(editId?'<button class="btn g" onclick="editId=null;render()">Batal</button>':'')+'</div><div class="card"><h3>Data inventaris</h3><div class="scroll"><table><tr><th>Kode</th><th>Nama</th><th>Kategori</th><th>Total</th><th>Kondisi</th><th></th></tr>'+rows+'</table></div></div>'}
function saveAlat(){var o={kode:v('k'),nama:v('n'),kategori:v('c'),total:parseInt(v('t'),10),kondisi:v('o')};
if(!o.kode||!o.nama||!(o.total>0)){document.getElementById('e').textContent='Kode, nama, dan jumlah (minimal 1) wajib diisi.';return}
if(S.alat.some(function(a){return a.kode===o.kode&&a.id!==editId})){document.getElementById('e').textContent='Kode alat sudah dipakai.';return}
if(editId){var a=S.alat.find(function(x){return x.id===editId});if(o.total<dipinjam(a.id)){document.getElementById('e').textContent='Jumlah total tidak boleh kurang dari unit yang sedang dipinjam.';return}Object.assign(a,o)}else{o.id=S.seq.alat++;S.alat.push(o)}
editId=null;save();render()}
function delAlat(id){if(dipinjam(id)>0){alert('Alat masih dipinjam, tidak bisa dihapus.');return}if(confirm('Hapus alat ini?')){S.alat=S.alat.filter(function(a){return a.id!==id});save();render()}}
function v(i){return document.getElementById(i).value.trim()}
function vPinjam(){var opts=S.alat.filter(function(a){return sedia(a)>0&&a.kondisi!=='Rusak'}).map(function(a){return '<option value="'+a.id+'">'+esc(a.nama)+' (sedia '+sedia(a)+')</option>'}).join('');
var d=new Date();d.setDate(d.getDate()+3);
return '<div class="card"><h3>Catat peminjaman</h3><div class="row"><div><label>Nama peminjam</label><input id="pn"></div><div><label>NIM/NIP</label><input id="pi"></div><div><label>Alat</label><select id="pa">'+opts+'</select></div><div><label>Jumlah</label><input id="pj" type="number" min="1" value="1"></div><div><label>Tenggat kembali</label><input id="pt" type="date" value="'+d.toISOString().slice(0,10)+'"></div><div><label>Petugas</label><input id="pp" value="'+esc(lastPetugas)+'"></div></div><div class="err" id="e"></div><button class="btn" onclick="addPinjam()">Simpan peminjaman</button></div>'}
function addPinjam(){var a=S.alat.find(function(x){return x.id==v('pa')}),j=parseInt(v('pj'),10),t=v('pt');
var m=!v('pn')||!v('pi')||!v('pp')?'Nama, NIM/NIP, dan petugas wajib diisi.':!a?'Pilih alat.':!(j>0)?'Jumlah tidak valid.':j>sedia(a)?'Stok tidak cukup, tersedia '+sedia(a)+' unit.':t<today()?'Tenggat tidak boleh sebelum hari ini.':'';
if(m){document.getElementById('e').textContent=m;return}
S.pinjam.push({id:S.seq.pinjam++,alatId:a.id,peminjam:v('pn'),idn:v('pi'),jumlah:j,tglPinjam:today(),tenggat:t,tglKembali:null,petugas:v('pp')});lastPetugas=v('pp');save();go('kembali')}
function vKembali(){var act=S.pinjam.filter(function(p){return!p.tglKembali});
var rows=act.map(function(p){return '<tr><td>'+esc(p.peminjam)+'<br><span class="hint">'+esc(p.idn)+'</span></td><td>'+esc(nm(p.alatId))+' ×'+p.jumlah+'</td><td>'+p.tglPinjam+'</td><td>'+p.tenggat+'</td><td>'+tag(status(p))+'</td><td><button class="btn s" onclick="kembali('+p.id+')">Kembalikan</button></td></tr>'}).join('')||'<tr><td colspan="6" class="hint">Semua alat sudah dikembalikan.</td></tr>';
return '<div class="card"><h3>Pengembalian alat</h3><p class="hint">Pilih peminjaman aktif lalu tandai sebagai dikembalikan. Stok bertambah otomatis.</p><div class="scroll"><table><tr><th>Peminjam</th><th>Alat</th><th>Pinjam</th><th>Tenggat</th><th>Status</th><th></th></tr>'+rows+'</table></div></div>'}
function kembali(id){var p=S.pinjam.find(function(x){return x.id===id});if(confirm('Tandai '+nm(p.alatId)+' dari '+p.peminjam+' sebagai dikembalikan?')){p.tglKembali=today();save();render()}}
var fil={q:'',s:''};
function riwayatRows(){return S.pinjam.slice().reverse().filter(function(p){var st=status(p)[0],q=fil.q.toLowerCase();return(!q||(p.peminjam+p.idn+nm(p.alatId)).toLowerCase().indexOf(q)>-1)&&(!fil.s||st===fil.s)})}
function vRiwayat(){var r=riwayatRows(),rows=r.map(function(p){return '<tr><td>'+p.id+'</td><td>'+esc(p.peminjam)+' <span class="hint">'+esc(p.idn)+'</span></td><td>'+esc(nm(p.alatId))+' ×'+p.jumlah+'</td><td>'+p.tglPinjam+'</td><td>'+p.tenggat+'</td><td>'+(p.tglKembali||'–')+'</td><td>'+tag(status(p))+'</td><td>'+esc(p.petugas)+'</td></tr>'}).join('')||'<tr><td colspan="8" class="hint">Tidak ada data.</td></tr>';
return '<div class="card"><div class="bar-actions noprint"><h3>Riwayat peminjaman &amp; laporan</h3><div><button class="btn g s" onclick="csv()">Ekspor CSV</button> <button class="btn s" onclick="window.print()">Cetak</button></div></div><div class="row noprint"><div><label>Cari</label><input id="fq" value="'+esc(fil.q)+'" oninput="fil.q=this.value;upd()"></div><div><label>Status</label><select id="fs" onchange="fil.s=this.value;upd()">'+['','Dipinjam','Terlambat','Dikembalikan','Kembali terlambat'].map(function(s){return '<option value="'+s+'"'+(s===fil.s?' selected':'')+'>'+(s||'Semua')+'</option>'}).join('')+'</select></div></div><div class="scroll"><table><tr><th>#</th><th>Peminjam</th><th>Alat</th><th>Pinjam</th><th>Tenggat</th><th>Kembali</th><th>Status</th><th>Petugas</th></tr><tbody id="rb">'+rows+'</tbody></table></div><p class="hint">Total '+r.length+' catatan</p></div>'}
function upd(){var f=document.getElementById('fq'),pos=f.selectionStart;render();var n=document.getElementById('fq');n.focus();n.setSelectionRange(pos,pos)}
function csv(){var l=[['ID','Peminjam','NIM/NIP','Alat','Jumlah','Pinjam','Tenggat','Kembali','Status','Petugas']].concat(riwayatRows().map(function(p){return[p.id,p.peminjam,p.idn,nm(p.alatId),p.jumlah,p.tglPinjam,p.tenggat,p.tglKembali||'',status(p)[0],p.petugas]}));
var t=l.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
var w=window.open('','_blank');if(w){w.document.write('<pre>'+esc(t)+'</pre>')}else alert(t)}
render();
</script>
</body>
</html>
